name: Sync upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-mieru
  cancel-in-progress: true

jobs:
  sync:
    name: Sync enfein/mbox mieru
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          ref: mieru

      - name: Merge upstream
        id: merge
        run: |
          set -xeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/enfein/mbox.git
          git fetch upstream mieru --tags --force

          upstream_mieru=upstream/mieru
          local_mieru_commit="$(git log origin/mieru --format=%H --grep='^feat: add mieru protocol$' -1)"
          if [[ -z "$local_mieru_commit" ]]; then
            echo "::error::Unable to find the local mieru integration commit."
            exit 1
          fi

          upstream_patch_id="$(git show --pretty=format: "$upstream_mieru" | git patch-id --stable | cut -d' ' -f1)"
          local_patch_id="$(git show --pretty=format: "$local_mieru_commit" | git patch-id --stable | cut -d' ' -f1)"
          if [[ -z "$upstream_patch_id" || "$upstream_patch_id" != "$local_patch_id" ]]; then
            echo "::error::The upstream mieru patch changed and requires manual review."
            exit 1
          fi

          upstream_base="$(git rev-parse "${upstream_mieru}^")"
          git checkout -B sync-upstream-mieru
          git merge --no-edit "$upstream_base"
          if git diff --quiet origin/mieru...HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -xeuo pipefail
          git push --force-with-lease origin sync-upstream-mieru

      - name: Create pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -xeuo pipefail
          gh pr create \
            --base mieru \
            --head sync-upstream-mieru \
            --title "sync: merge enfein/mbox mieru" \
            --body "Automated upstream sync from enfein/mbox@mieru." \
          || gh pr edit sync-upstream-mieru \
            --title "sync: merge enfein/mbox mieru" \
            --body "Automated upstream sync from enfein/mbox@mieru."
