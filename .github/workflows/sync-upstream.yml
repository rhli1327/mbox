name: Sync upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-mieru
  cancel-in-progress: true

jobs:
  sync:
    name: Sync enfein/mbox mieru
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          ref: mieru

      - name: Merge upstream
        id: merge
        run: |
          set -xeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/enfein/mbox.git
          git fetch --no-tags upstream mieru
          git fetch --no-tags upstream '+refs/tags/*:refs/upstream-tags/enfein/*'

          upstream_mieru=upstream/mieru
          upstream_tag="$(git for-each-ref --points-at "$upstream_mieru" --sort=-version:refname --format='%(refname:strip=3)' refs/upstream-tags/enfein | head -n1)"
          if [[ ! "$upstream_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Unable to determine the upstream mbox version."
            exit 1
          fi
          if git merge-base --is-ancestor "$upstream_mieru" origin/mieru; then
            echo "Upstream mieru commit $upstream_mieru is already merged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B sync-upstream-mieru origin/mieru
          git merge --no-ff --no-edit "$upstream_mieru"
          printf '%s\n' "${upstream_tag#v}" > release/BASE_VERSION
          if ! git diff --quiet -- release/BASE_VERSION; then
            git add release/BASE_VERSION
            git commit -m "release: track upstream ${upstream_tag#v}"
          fi
          git merge-base --is-ancestor "$upstream_mieru" HEAD
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -xeuo pipefail
          git push --force-with-lease origin sync-upstream-mieru

      - name: Create pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -xeuo pipefail
          gh pr create \
            --base mieru \
            --head sync-upstream-mieru \
            --title "sync: merge enfein/mbox mieru" \
            --body "Automated upstream sync from enfein/mbox@mieru." \
          || gh pr edit sync-upstream-mieru \
            --title "sync: merge enfein/mbox mieru" \
            --body "Automated upstream sync from enfein/mbox@mieru."
