name: Build traffic statistics Debian channel

on:
  push:
    branches:
      - traffic-statistics
  pull_request:
    branches:
      - traffic-statistics
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test traffic statistics
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache: true

      - name: Install test prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tcpdump
          sudo -n true

      - name: Load repository build settings
        run: |
          set -euo pipefail
          echo "BUILD_TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"

      - name: Assert nested manifests are tidy
        run: |
          set -euo pipefail
          (
            cd test
            env GOWORK=off GOTOOLCHAIN=local go mod tidy
          )
          git diff --exit-code -- \
            go.mod \
            go.sum \
            test/go.mod \
            test/go.sum

      # The nested integration suite requires tcp-brutal, external-network access,
      # and native Docker-host topology. This generic job verifies both test builds.
      - name: Compile untagged nested test binary
        run: |
          set -euo pipefail
          (
            cd test
            env GOWORK=off GOTOOLCHAIN=local \
              go test \
              -mod=readonly \
              -count=1 \
              -run '^$' \
              .
          )

      - name: Compile release-tagged nested test binary
        run: |
          set -euo pipefail
          (
            cd test
            env GOWORK=off GOTOOLCHAIN=local \
              go test \
              -mod=readonly \
              -count=1 \
              -run '^$' \
              -tags "$BUILD_TAGS" \
              -ldflags "$LDFLAGS_SHARED" \
              .
          )

      - name: Test traffic statistics
        run: |
          set -euo pipefail
          env GOWORK=off GOTOOLCHAIN=local \
            go test \
            -mod=readonly \
            -count=1 \
            ./common/trafficcontrol/... \
            ./experimental/clashapi \
            ./service/api \
            .

      - name: Test traffic accounting with race detector
        run: |
          set -euo pipefail
          env GOWORK=off GOTOOLCHAIN=local \
            go test \
            -mod=readonly \
            -count=1 \
            -race \
            ./common/trafficcontrol

      - name: Test outbound-dependent Box lifecycle with race detector
        run: |
          set -euo pipefail
          env GOWORK=off GOTOOLCHAIN=local \
            go test \
            -mod=readonly \
            -count=1 \
            -race \
            -run '^TestBoxOutboundDependent' \
            .

      - name: Test root module
        run: |
          set -euo pipefail
          env GOWORK=off GOTOOLCHAIN=local \
            go test \
            -mod=readonly \
            -count=1 \
            -ldflags "$LDFLAGS_SHARED" \
            ./...

      - name: Test root module with release tags
        run: |
          set -euo pipefail
          env GOWORK=off GOTOOLCHAIN=local \
            go test \
            -mod=readonly \
            -count=1 \
            -v \
            -exec sudo \
            -tags "$BUILD_TAGS" \
            -ldflags "$LDFLAGS_SHARED" \
            ./...

      - name: Assert module manifests remain unchanged
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            go.mod \
            go.sum \
            test/go.mod \
            test/go.sum

  postgres-integration:
    name: PostgreSQL 14 integration
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      POSTGRES_CONTAINER: mbox-traffic-statistics-postgres
      POSTGRES_PORT: "55432"
      POSTGRES_DATABASE: mbox_statistics_ci
      POSTGRES_ADMIN_PASSWORD: mbox_ci_admin
      POSTGRES_SCHEMA_USER: mbox_ci_schema
      POSTGRES_SCHEMA_PASSWORD: mbox_ci_schema_password
      POSTGRES_DATA_USER: mbox_ci_data
      POSTGRES_DATA_PASSWORD: mbox_ci_data_password
      POSTGRES_VALIDATE_USER: mbox_ci_validate
      POSTGRES_VALIDATE_PASSWORD: mbox_ci_validate_password
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache: true

      - name: Generate PostgreSQL test CA
        run: |
          set -euo pipefail
          cert_dir="${RUNNER_TEMP}/mbox-postgres-certs"
          mkdir -p "$cert_dir"
          cat > "$cert_dir/server.cnf" <<'EOF'
          [req]
          distinguished_name = subject
          prompt = no
          req_extensions = extensions

          [subject]
          CN = localhost

          [extensions]
          subjectAltName = @names

          [names]
          DNS.1 = localhost
          IP.1 = 127.0.0.1
          EOF
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=mbox-postgres-test-ca' \
            -keyout "$cert_dir/ca.key" \
            -out "$cert_dir/ca.crt"
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$cert_dir/server.key" \
            -out "$cert_dir/server.csr" \
            -config "$cert_dir/server.cnf"
          openssl x509 -req -days 1 \
            -in "$cert_dir/server.csr" \
            -CA "$cert_dir/ca.crt" \
            -CAkey "$cert_dir/ca.key" \
            -CAcreateserial \
            -out "$cert_dir/server.crt" \
            -extensions extensions \
            -extfile "$cert_dir/server.cnf"
          echo "POSTGRES_CERT_DIR=${cert_dir}" >> "$GITHUB_ENV"

      - name: Start pinned PostgreSQL 14
        run: |
          set -euo pipefail
          docker run -d \
            --name "$POSTGRES_CONTAINER" \
            --tmpfs /var/lib/postgresql/data \
            -e "POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD}" \
            -e "POSTGRES_DB=${POSTGRES_DATABASE}" \
            -p "127.0.0.1:${POSTGRES_PORT}:5432" \
            postgres@sha256:9062043625415b4628f0ca44c2c65de93778afb7b1db33aff67877cace3b966f
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec "$POSTGRES_CONTAINER" \
              pg_isready -U postgres -d "$POSTGRES_DATABASE" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$POSTGRES_CONTAINER"
            exit 1
          fi

      - name: Configure isolated PostgreSQL roles and TLS
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" \
            psql -U postgres -d "$POSTGRES_DATABASE" -v ON_ERROR_STOP=1 \
            -c "
              CREATE ROLE ${POSTGRES_SCHEMA_USER}
                LOGIN PASSWORD '${POSTGRES_SCHEMA_PASSWORD}';
              CREATE ROLE ${POSTGRES_DATA_USER}
                LOGIN PASSWORD '${POSTGRES_DATA_PASSWORD}';
              CREATE ROLE ${POSTGRES_VALIDATE_USER}
                LOGIN PASSWORD '${POSTGRES_VALIDATE_PASSWORD}';
              GRANT CONNECT, CREATE ON DATABASE ${POSTGRES_DATABASE}
                TO ${POSTGRES_SCHEMA_USER};
              GRANT CONNECT ON DATABASE ${POSTGRES_DATABASE}
                TO ${POSTGRES_DATA_USER}, ${POSTGRES_VALIDATE_USER};
              REVOKE CREATE ON DATABASE ${POSTGRES_DATABASE}
                FROM ${POSTGRES_DATA_USER}, ${POSTGRES_VALIDATE_USER};
            "
          docker cp "$POSTGRES_CERT_DIR/server.crt" \
            "$POSTGRES_CONTAINER:/tmp/server.crt"
          docker cp "$POSTGRES_CERT_DIR/server.key" \
            "$POSTGRES_CONTAINER:/tmp/server.key"
          docker cp "$POSTGRES_CERT_DIR/ca.crt" \
            "$POSTGRES_CONTAINER:/tmp/ca.crt"
          docker exec -u root "$POSTGRES_CONTAINER" \
            chown postgres:postgres /tmp/server.crt /tmp/server.key /tmp/ca.crt
          docker exec -u root "$POSTGRES_CONTAINER" chmod 600 /tmp/server.key
          docker exec "$POSTGRES_CONTAINER" \
            psql -U postgres -d "$POSTGRES_DATABASE" -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET ssl = 'on'"
          docker exec "$POSTGRES_CONTAINER" \
            psql -U postgres -d "$POSTGRES_DATABASE" -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET ssl_cert_file = '/tmp/server.crt'"
          docker exec "$POSTGRES_CONTAINER" \
            psql -U postgres -d "$POSTGRES_DATABASE" -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET ssl_key_file = '/tmp/server.key'"
          docker exec "$POSTGRES_CONTAINER" \
            psql -U postgres -d "$POSTGRES_DATABASE" -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET ssl_ca_file = '/tmp/ca.crt'"
          docker exec "$POSTGRES_CONTAINER" \
            psql -U postgres -d "$POSTGRES_DATABASE" -v ON_ERROR_STOP=1 \
            -c "SELECT pg_reload_conf()"

      - name: Test PostgreSQL store and schema
        env:
          MBOX_TEST_POSTGRES_ADMIN_DSN: postgres://postgres:mbox_ci_admin@localhost:55432/mbox_statistics_ci?sslmode=disable
          MBOX_TEST_POSTGRES_SCHEMA_DSN: postgres://mbox_ci_schema:mbox_ci_schema_password@localhost:55432/mbox_statistics_ci?sslmode=disable
          MBOX_TEST_POSTGRES_DSN: postgres://mbox_ci_data:mbox_ci_data_password@localhost:55432/mbox_statistics_ci?sslmode=disable
          MBOX_TEST_POSTGRES_VALIDATE_DSN: postgres://mbox_ci_validate:mbox_ci_validate_password@localhost:55432/mbox_statistics_ci?sslmode=disable
        run: |
          set -euo pipefail
          export MBOX_TEST_POSTGRES_TLS_DSN="postgres://mbox_ci_data:mbox_ci_data_password@localhost:55432/mbox_statistics_ci?sslmode=verify-full&sslrootcert=${POSTGRES_CERT_DIR}/ca.crt"
          export MBOX_TEST_POSTGRES_SSLROOTCERT="${POSTGRES_CERT_DIR}/ca.crt"
          env GOWORK=off GOTOOLCHAIN=local go test \
            -mod=readonly \
            -count=1 \
            -tags with_postgres \
            ./common/trafficcontrol
          env GOWORK=off GOTOOLCHAIN=local go test \
            -mod=readonly \
            -count=1 \
            -race \
            -tags with_postgres \
            -run '^(TestPostgresHistoryBackendContract|TestPostgresSchemaConcurrentInitializers|TestPostgresDetourUsesSelectedOutbound|TestPostgresDetourCancelRequestUsesLogicalTarget|TestPostgresStoreRetriesOpenAfterDetourFailure)$' \
            ./common/trafficcontrol
          env GOWORK=off GOTOOLCHAIN=local go test \
            -mod=readonly \
            -count=1 \
            -tags with_postgres \
            -run '^TestTrafficStatisticsSchemaMigrateCommandIntegration$' \
            ./cmd/sing-box

      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f "$POSTGRES_CONTAINER" >/dev/null 2>&1 || true

  build:
    name: Build Debian package (${{ matrix.debian_arch }})
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/traffic-statistics' }}
    needs:
      - test
      - postgres-integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - go_arch: amd64
            debian_arch: amd64
          - go_arch: arm64
            debian_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache: true

      - name: Resolve version
        run: |
          set -xeuo pipefail
          git fetch origin mieru --tags --force
          upstream_base="$(git merge-base HEAD origin/mieru)"
          base_tag="$(git describe --tags --abbrev=0 "$upstream_base")"
          base_version="${base_tag#v}"
          traffic_version="${base_version}+traffic.${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"
          echo "TRAFFIC_VERSION=${traffic_version}" >> "$GITHUB_ENV"

      - name: Clone cronet-go
        run: |
          set -xeuo pipefail
          cronet_go_version="$(cat .github/CRONET_GO_VERSION)"
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "$cronet_go_version"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Prepare musl toolchain
        env:
          TARGET_ARCH: ${{ matrix.go_arch }}
        run: |
          set -xeuo pipefail
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
          go run ./cmd/build-naive --target="linux/${TARGET_ARCH}" --libc=musl download-toolchain
          go run ./cmd/build-naive --target="linux/${TARGET_ARCH}" --libc=musl env >> "$GITHUB_ENV"

      - name: Build static binary
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.go_arch }}
        run: |
          set -xeuo pipefail
          tags="$(cat release/DEFAULT_BUILD_TAGS_OTHERS),with_naive_outbound,with_musl"
          ldflags="$(cat release/LDFLAGS)"
          mkdir -p dist
          go build -v -trimpath \
            -o dist/mbox \
            -tags "$tags" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${TRAFFIC_VERSION}' ${ldflags} -s -w -buildid=" \
            ./cmd/sing-box
          if readelf -l dist/mbox | grep "Requesting program interpreter" >/dev/null; then
            echo "The Debian package binary is dynamically linked."
            exit 1
          fi

      - name: Package Debian archive
        env:
          DEBIAN_ARCH: ${{ matrix.debian_arch }}
        run: |
          set -xeuo pipefail
          sudo gem install fpm
          cp .fpm_systemd .fpm
          package_name="mbox-traffic-statistics_linux_${DEBIAN_ARCH}.deb"
          package_path="dist/${package_name}"
          fpm -t deb \
            -v "$TRAFFIC_VERSION" \
            -p "$package_path" \
            --architecture "$DEBIAN_ARCH" \
            dist/mbox=/usr/bin/mbox
          dpkg-deb --info "$package_path"
          dpkg-deb --contents "$package_path" | grep "./usr/bin/mbox" >/dev/null
          (
            cd dist
            sha256sum "$package_name" > "${package_name}.sha256"
          )
          rm dist/mbox

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: mbox-traffic-statistics-linux-${{ matrix.debian_arch }}
          path: |
            dist/*.deb
            dist/*.sha256

  publish:
    name: Update rolling release
    if: github.ref == 'refs/heads/traffic-statistics'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish traffic-statistics release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag --force traffic-statistics-latest "$GITHUB_SHA"
          git push origin refs/tags/traffic-statistics-latest --force

          if gh release view traffic-statistics-latest >/dev/null 2>&1; then
            for legacy_asset in \
              mbox-traffic-statistics_linux_amd64.tar.gz \
              mbox-traffic-statistics_linux_amd64.tar.gz.sha256 \
              mbox-traffic-statistics_linux_arm64.tar.gz \
              mbox-traffic-statistics_linux_arm64.tar.gz.sha256 \
              sing-box-traffic-statistics_linux_amd64.tar.gz \
              sing-box-traffic-statistics_linux_amd64.tar.gz.sha256 \
              sing-box-traffic-statistics_linux_arm64.tar.gz \
              sing-box-traffic-statistics_linux_arm64.tar.gz.sha256
            do
              gh release delete-asset traffic-statistics-latest "$legacy_asset" --yes 2>/dev/null || true
            done
            gh release upload traffic-statistics-latest dist/* --clobber
            gh release edit traffic-statistics-latest \
              --title "mbox traffic statistics build" \
              --notes "Rolling Debian amd64/arm64 packages from the traffic-statistics branch." \
              --prerelease
          else
            gh release create traffic-statistics-latest dist/* \
              --title "mbox traffic statistics build" \
              --notes "Rolling Debian amd64/arm64 packages from the traffic-statistics branch." \
              --prerelease
          fi
